name: Daily ETF Predictor Alert

on:
  workflow_dispatch: # 支援 Cron-Job.org 外部 API 觸發與網頁手動觸發

permissions:
  contents: write

jobs:
  run-predictor:
    runs-on: ubuntu-latest
    steps:
      - name: 下載程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install requests pandas line-bot-sdk

      - name: 執行預測並發送 Line 推播
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python etf_predictor_line.py

      - name: 自動儲存名次歷史檔至儲存庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previous_ranks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update previous ranks" && git push)
